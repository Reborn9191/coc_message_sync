# Example HTTPS reverse proxy. Put TLS termination in front of the bridge.
# Replace the certificate paths and bridge.example.com before use.
server {
    listen 443 ssl http2;
    server_name bridge.example.com;

    ssl_certificate /etc/letsencrypt/live/bridge.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bridge.example.com/privkey.pem;

    client_max_body_size 64k;
    proxy_read_timeout 15s;

    location /api/v1/messages {
        proxy_pass http://bridge:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Restrict admin endpoints and metrics to a private network.
    location ~ ^/(api/v1/admin|metrics|readyz) {
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
        proxy_pass http://bridge:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /healthz {
        proxy_pass http://bridge:8000;
    }
}

